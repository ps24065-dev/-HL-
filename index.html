<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>문학 인용구 정리 노트 — 팀 공동작업</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans KR",sans-serif;background:#f6f6f8;color:#202124}
.app{display:flex;min-height:100vh}
.sidebar{width:245px;background:#17181c;color:#fff;padding:24px 15px;position:sticky;top:0;height:100vh}
.brand{font-size:20px;font-weight:800;margin:0 8px 25px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{border:0;background:transparent;color:#aaa;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;font:inherit}
.nav button:hover,.nav button.active{background:#2b2d33;color:#fff}
.main{flex:1;padding:32px;max-width:1250px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}
h1{margin:0 0 7px;font-size:29px}.desc{color:#777}
.primary{border:0;background:#222;color:#fff;border-radius:9px;padding:10px 15px;cursor:pointer;font:inherit}
.editor{display:none;background:#fff;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 3px 15px #0000000b}
.editor.show{display:block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid #ddd;border-radius:9px;font:inherit}
textarea{min-height:100px;margin-top:10px;resize:vertical}
.keyword-input{margin-top:10px}
.help{font-size:12px;color:#888;margin-top:6px}
.editor-actions{display:flex;gap:8px;margin-top:10px}
.small{border:0;background:#eee;border-radius:8px;padding:7px 10px;cursor:pointer}
.danger{background:#ffe6e6;color:#b00000}
.toolbar{background:#fff;border-radius:15px;padding:15px;margin-bottom:22px;box-shadow:0 3px 15px #0000000b}
.tabs{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid #ddd;background:#fff;border-radius:99px;padding:8px 13px;cursor:pointer}
.chip.active{background:#222;color:#fff;border-color:#222}
.search{margin-top:12px}
.section{margin:25px 0}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.section-title{font-size:20px;font-weight:800}.count{font-size:13px;color:#888}
.quote{position:relative;background:#fff;border-radius:14px;padding:19px 20px;margin-bottom:12px;box-shadow:0 2px 11px #0000000b;cursor:pointer}
.quote:hover{transform:translateY(-1px);box-shadow:0 6px 18px #0000000e}
.work{font-size:13px;color:#777;margin-bottom:7px}.quote-text{font-size:17px;line-height:1.7;font-weight:600}
.quote-context{font-size:13px;color:#888;margin-top:8px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:11px}
.tag{background:#f0f0f2;border-radius:99px;padding:5px 9px;font-size:12px}
.actions{display:flex;gap:7px;margin-top:12px}
.empty{background:#fff;border-radius:14px;padding:40px;text-align:center;color:#888}
.keyword-card{background:#fff;border-radius:14px;padding:18px;margin-bottom:13px;box-shadow:0 2px 11px #0000000b}
.keyword-title{font-size:19px;font-weight:800;margin-bottom:12px}
.evidence{border-left:3px solid #ddd;padding:9px 12px;margin:9px 0;cursor:pointer}
.evidence:hover{background:#f7f7f8}
.evidence-work{font-size:12px;color:#777}.evidence-text{margin-top:4px;line-height:1.6}
.modal{display:none;position:fixed;inset:0;background:#0007;align-items:center;justify-content:center;padding:20px;z-index:10}
.modal.show{display:flex}.box{background:#fff;width:min(700px,100%);max-height:85vh;overflow:auto;border-radius:18px;padding:27px}
.close{float:right;border:0;background:#eee;padding:7px 10px;border-radius:7px;cursor:pointer}
.modal-work{color:#777;font-size:14px}.modal h2{margin:7px 0 17px}.modal-quote{font-size:20px;line-height:1.8;font-weight:700;padding:15px 0}.modal p{line-height:1.8;white-space:pre-wrap}
@media(max-width:700px){.app{display:block}.sidebar{width:100%;height:auto;position:static}.nav{flex-direction:row;overflow:auto}.main{padding:18px}.grid{grid-template-columns:1fr}.top{display:block}.top button{margin-top:14px}}
</style>
</head>
<body>
<div id="loginScreen" style="position:fixed;inset:0;background:#f6f6f8;z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;width:min(430px,100%);padding:30px;border-radius:18px;box-shadow:0 8px 30px #00000012">
    <h1 style="margin:0 0 8px;font-size:25px">문학 인용구 공동 작업실</h1>
    <p style="color:#777;line-height:1.6;margin:0 0 20px">팀 계정으로 로그인하면 같은 인용구 데이터를 함께 편집할 수 있습니다.</p>
    <input id="loginEmail" type="email" placeholder="팀 계정 이메일" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit;margin-bottom:10px">
    <input id="loginPassword" type="password" placeholder="비밀번호" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit;margin-bottom:10px">
    <button id="loginButton" class="primary" style="width:100%" onclick="login()">로그인</button>
    <div id="loginStatus" style="font-size:13px;color:#b00000;margin-top:10px;min-height:20px"></div>
    <div style="font-size:12px;color:#999;line-height:1.5;margin-top:12px">이 사이트는 초대된 팀 계정만 사용할 수 있도록 구성되어 있습니다.</div>
  </div>
</div>

<div class="app">
<aside class="sidebar">
  <div class="brand">LITERATURE NOTES</div>
  <div class="nav">
    <button class="active" onclick="switchView('all')">📚 전체 인용구</button>
    <button onclick="switchView('work')">📖 작품별 정리</button>
    <button onclick="switchView('keyword')">🔎 키워드별 정리</button>
  </div>
</aside>

<main class="main">
  <div class="top">
    <div id="accountBar" style="position:absolute;right:32px;top:14px;font-size:12px;color:#777"></div>
    <div>
      <h1 id="pageTitle">전체 인용구</h1>
      <div class="desc">작품 속 인용구를 저장하고, 키워드와 연결해 근거를 한눈에 정리하세요.</div>
    </div>
    <button class="primary" onclick="toggleEditor()">＋ 인용구 추가</button>
  </div>

  <div id="editor" class="editor">
    <div class="grid">
      <select id="work"></select>
      <input id="title" placeholder="인용구 제목 / 장면 이름 (선택)">
    </div>
    <textarea id="quote" placeholder="인용구를 입력하세요."></textarea>
    <textarea id="analysis" placeholder="이 인용구가 보여주는 의미, 장면의 맥락, 분석 등을 입력하세요."></textarea>
    <input id="keywords" class="keyword-input" placeholder="키워드 입력 — 쉼표로 구분 (예: 가족, 상실, 책임)">
    <div class="help">하나의 인용구에 여러 키워드를 연결할 수 있습니다. 같은 키워드는 작품과 관계없이 자동으로 묶입니다.</div>
    <div class="editor-actions">
      <button class="primary" onclick="saveQuote()">저장</button>
      <button class="small" onclick="cancelEdit()">취소</button>
    </div>
  </div>

  <div id="toolbar" class="toolbar">
    <div id="filters" class="tabs"></div>
    <input id="search" class="search" placeholder="인용구, 작품, 키워드, 분석 내용 검색..." oninput="render()">
  </div>

  <div id="content"></div>
</main>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
  <div class="box">
    <button class="close" onclick="closeModal()">닫기</button>
    <div id="mWork" class="modal-work"></div>
    <h2 id="mTitle"></h2>
    <div id="mQuote" class="modal-quote"></div>
    <p id="mAnalysis"></p>
    <div id="mTags" class="tags"></div>
  </div>
</div>

<script>
/*
  ============================================================
  TEAM VERSION — Supabase configuration
  ------------------------------------------------------------
  1) Create a Supabase project.
  2) Put your Project URL and Publishable key below.
  3) Run the supplied SUPABASE_SETUP.sql in SQL Editor.
  4) Create team accounts in Authentication > Users.
  ============================================================
*/
const SUPABASE_URL = "https://nhqqeboiodleypbdawjt.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_aLci4FDg4-hjXIlYLUv_0Q_Qcpr_lhF";

const isConfigured =
  SUPABASE_URL.startsWith("https://") &&
  !SUPABASE_URL.includes("PASTE_") &&
  !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_");

const supabaseClient = isConfigured
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;

const WORKS=["이선프롬","입동","벌레들","노찬성과 에반","메데이아"];

let quotes=[];
let view="all";
let activeWork="전체";
let activeKeyword="전체";
let editId=null;
let currentUser=null;
let realtimeChannel=null;

function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}

function showLogin(message=""){
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("loginStatus").textContent=message;
}
function hideLogin(){
  document.getElementById("loginScreen").style.display="none";
}
function setLoginMessage(msg){document.getElementById("loginStatus").textContent=msg||"";}

async function login(){
  if(!supabaseClient){
    setLoginMessage("아직 Supabase 설정이 완료되지 않았습니다. 안내 파일의 1~3단계를 먼저 진행하세요.");
    return;
  }
  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;
  if(!email||!password){setLoginMessage("이메일과 비밀번호를 입력해주세요.");return;}
  const btn=document.getElementById("loginButton");
  btn.disabled=true;
  setLoginMessage("로그인 중...");
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  btn.disabled=false;
  if(error){setLoginMessage("로그인 실패: "+error.message);return;}
  currentUser=data.user;
  await startApp();
}

async function logout(){
  if(!supabaseClient)return;
  await supabaseClient.auth.signOut();
  currentUser=null;
  quotes=[];
  if(realtimeChannel) await supabaseClient.removeChannel(realtimeChannel);
  showLogin("");
}

async function startApp(){
  hideLogin();
  document.getElementById("accountBar").innerHTML =
    `${esc(currentUser.email)} · <button class="small" onclick="logout()">로그아웃</button>`;
  refreshWorkSelect();
  await load();
  subscribeRealtime();
}

async function load(){
  if(!supabaseClient)return;
  const {data,error}=await supabaseClient
    .from("quotes")
    .select("*")
    .order("created_at",{ascending:true});
  if(error){
    alert("인용구를 불러오지 못했습니다.\n"+error.message);
    return;
  }
  quotes=(data||[]).map(normalizeRow);
  render();
}

function normalizeRow(row){
  return {
    id:row.id,
    work:row.work,
    title:row.title||"",
    quote:row.quote||"",
    analysis:row.analysis||"",
    keywords:Array.isArray(row.keywords)?row.keywords:[]
  };
}

function refreshWorkSelect(){
  const s=document.getElementById("work");
  const old=s.value;
  s.innerHTML=WORKS.map(w=>`<option>${esc(w)}</option>`).join("");
  if(WORKS.includes(old))s.value=old;
}

function allKeywords(){
  return [...new Set(quotes.flatMap(q=>q.keywords||[]).map(x=>x.trim()).filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"ko"));
}

function switchView(v){
  view=v;activeWork="전체";activeKeyword="전체";
  document.querySelectorAll(".nav button").forEach((b,i)=>
    b.classList.toggle("active",["all","work","keyword"][i]===v)
  );
  document.getElementById("pageTitle").textContent=
    v==="all"?"전체 인용구":v==="work"?"작품별 정리":"키워드별 정리";
  render();
}

function renderFilters(){
  const f=document.getElementById("filters");f.innerHTML="";
  if(view==="work"){
    ["전체",...WORKS].forEach(w=>{
      const b=document.createElement("button");
      b.className="chip "+(activeWork===w?"active":"");
      b.textContent=w;b.onclick=()=>{activeWork=w;render()};f.appendChild(b);
    });
  }else if(view==="keyword"){
    ["전체",...allKeywords()].forEach(k=>{
      const b=document.createElement("button");
      b.className="chip "+(activeKeyword===k?"active":"");
      b.textContent=k;b.onclick=()=>{activeKeyword=k;render()};f.appendChild(b);
    });
  }else{
    f.innerHTML='<span style="color:#777;font-size:13px">모든 작품의 인용구를 한곳에서 확인</span>';
  }
}

function matchesSearch(q){
  const s=document.getElementById("search").value.toLowerCase();
  return !s||(q.quote+" "+q.title+" "+q.work+" "+q.analysis+" "+(q.keywords||[]).join(" "))
    .toLowerCase().includes(s);
}

function render(){
  renderFilters();
  const content=document.getElementById("content");content.innerHTML="";
  if(view==="keyword"){renderKeywords(content);return}
  let arr=quotes.filter(matchesSearch);
  if(view==="work"&&activeWork!=="전체")arr=arr.filter(q=>q.work===activeWork);
  if(!arr.length){
    content.innerHTML='<div class="empty">아직 정리된 인용구가 없습니다.<br>「＋ 인용구 추가」로 시작해보세요.</div>';
    return;
  }
  if(view==="work"){
    WORKS.filter(w=>activeWork==="전체"||w===activeWork).forEach(w=>{
      const list=arr.filter(q=>q.work===w);if(!list.length)return;
      content.appendChild(makeSection(w,list));
    });
  }else content.appendChild(makeSection("전체 인용구",arr));
}

function makeSection(title,list){
  const sec=document.createElement("section");sec.className="section";
  sec.innerHTML=`<div class="section-head"><div class="section-title">${esc(title)}</div><div class="count">${list.length}개</div></div>`;
  list.forEach(q=>sec.appendChild(makeQuote(q)));
  return sec;
}

function makeQuote(q){
  const card=document.createElement("div");card.className="quote";
  card.innerHTML=`
    <div class="work">${esc(q.work)}${q.title?" · "+esc(q.title):""}</div>
    <div class="quote-text">“${esc(q.quote)}”</div>
    <div class="quote-context">${esc(q.analysis||"")}</div>
    <div class="tags">${(q.keywords||[]).map(k=>`<span class="tag">${esc(k)}</span>`).join("")}</div>
    <div class="actions">
      <button class="small" onclick="editQuote('${q.id}')">수정</button>
      <button class="small danger" onclick="deleteQuote('${q.id}')">삭제</button>
    </div>`;
  card.onclick=e=>{if(!e.target.closest("button"))openModal(q.id)};
  return card;
}

function renderKeywords(content){
  const kw=allKeywords().filter(k=>activeKeyword==="전체"||k===activeKeyword);
  if(!kw.length){
    content.innerHTML='<div class="empty">아직 키워드가 없습니다.<br>인용구에 키워드를 추가하면 여기에 자동으로 묶입니다.</div>';
    return;
  }
  kw.forEach(k=>{
    const list=quotes.filter(q=>(q.keywords||[]).includes(k)).filter(matchesSearch);
    if(!list.length)return;
    const card=document.createElement("div");card.className="keyword-card";
    card.innerHTML=`<div class="keyword-title"># ${esc(k)} <span class="count">· ${list.length}개 근거</span></div>`;
    list.forEach(q=>{
      const e=document.createElement("div");e.className="evidence";
      e.innerHTML=`<div class="evidence-work">${esc(q.work)}${q.title?" · "+esc(q.title):""}</div><div class="evidence-text">“${esc(q.quote)}”</div>`;
      e.onclick=()=>openModal(q.id);card.appendChild(e);
    });
    content.appendChild(card);
  });
}

function toggleEditor(){
  document.getElementById("editor").classList.toggle("show");
}

async function saveQuote(){
  if(!supabaseClient||!currentUser)return;
  const work=document.getElementById("work").value;
  const title=document.getElementById("title").value.trim();
  const quote=document.getElementById("quote").value.trim();
  const analysis=document.getElementById("analysis").value.trim();
  const keywords=document.getElementById("keywords").value.split(",").map(x=>x.trim()).filter(Boolean);
  if(!quote||!work){alert("작품과 인용구를 입력해주세요.");return;}

  const payload={
    work,title,quote,analysis,
    keywords:[...new Set(keywords)]
  };

  let result;
  if(editId){
    result=await supabaseClient.from("quotes").update(payload).eq("id",editId).select().single();
  }else{
    result=await supabaseClient.from("quotes").insert({
      ...payload,
      created_by:currentUser.id
    }).select().single();
  }

  if(result.error){
    alert("저장하지 못했습니다.\n"+result.error.message);
    return;
  }
  cancelEdit();
  // Realtime will update everyone, including this browser.
}

function editQuote(id){
  const q=quotes.find(x=>x.id===id);if(!q)return;
  editId=id;
  document.getElementById("work").value=q.work;
  document.getElementById("title").value=q.title||"";
  document.getElementById("quote").value=q.quote;
  document.getElementById("analysis").value=q.analysis||"";
  document.getElementById("keywords").value=(q.keywords||[]).join(", ");
  document.getElementById("editor").classList.add("show");
  window.scrollTo({top:0,behavior:"smooth"});
}

async function deleteQuote(id){
  if(!supabaseClient||!currentUser)return;
  const q=quotes.find(x=>x.id===id);if(!q)return;
  if(!confirm("이 인용구를 삭제할까요?"))return;
  const {error}=await supabaseClient.from("quotes").delete().eq("id",id);
  if(error)alert("삭제하지 못했습니다.\n"+error.message);
}

function cancelEdit(){
  editId=null;
  document.getElementById("title").value="";
  document.getElementById("quote").value="";
  document.getElementById("analysis").value="";
  document.getElementById("keywords").value="";
  document.getElementById("editor").classList.remove("show");
}

function openModal(id){
  const q=quotes.find(x=>x.id===id);if(!q)return;
  document.getElementById("mWork").textContent=q.work+(q.title?" · "+q.title:"");
  document.getElementById("mTitle").textContent="인용구";
  document.getElementById("mQuote").textContent="“"+q.quote+"”";
  document.getElementById("mAnalysis").textContent=q.analysis||"";
  document.getElementById("mTags").innerHTML=(q.keywords||[]).map(k=>`<span class="tag"># ${esc(k)}</span>`).join("");
  document.getElementById("modal").classList.add("show");
}

function closeModal(){document.getElementById("modal").classList.remove("show")}

function subscribeRealtime(){
  if(!supabaseClient)return;
  if(realtimeChannel)supabaseClient.removeChannel(realtimeChannel);
  realtimeChannel=supabaseClient.channel("team-literature-quotes")
    .on("postgres_changes",
      {event:"*",schema:"public",table:"quotes"},
      payload=>{
        if(payload.eventType==="INSERT"){
          const row=normalizeRow(payload.new);
          if(!quotes.some(q=>q.id===row.id))quotes.push(row);
        }else if(payload.eventType==="UPDATE"){
          const row=normalizeRow(payload.new);
          const i=quotes.findIndex(q=>q.id===row.id);
          if(i>=0)quotes[i]=row;else quotes.push(row);
        }else if(payload.eventType==="DELETE"){
          quotes=quotes.filter(q=>q.id!==payload.old.id);
        }
        render();
      })
    .subscribe();
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

(async function init(){
  if(!isConfigured){
    showLogin("설정 파일을 먼저 따라 Supabase URL과 Publishable key를 HTML에 넣어주세요.");
    return;
  }
  const {data:{session}}=await supabaseClient.auth.getSession();
  if(session){
    currentUser=session.user;
    await startApp();
  }else{
    showLogin("");
  }
})();
</script>
</body>
</html>
